# Generated by: gromit policy
# Minimal PR build (feature: pr-minimal-build).
#
# On a pull_request the only artifact the pipeline consumes is the linux/amd64
# docker image (API/UI/release tests pull it via env-up). ci/Dockerfile.distroless
# builds that image by `dpkg -i`-ing the .deb, so the critical path is:
#   std/fips amd64 binary -> std/fips amd64 .deb -> amd64 image.
#
# This builds ONLY that (std + fips, amd64, deb) and drops what nothing on a PR
# consumes: arm64, s390x, and all .rpm. The full matrix lives in goreleaser.yml
# and runs on push/tags. release.yml selects this file with -f only on PRs.
# Keep the std/fips build + nfpm blocks in sync with goreleaser.yml.
version: 2
builds:
  - id: fips-amd64
    flags:
      - -tags=fips
    env:
      - NOP=nop # avoids a complex conditional in the templates
      - CC=gcc
      - GOFIPS140=v1.0.0
    ldflags:
      - -X github.com/TykTechnologies/tyk-analytics/internal/build.Version={{.Version}}
      - -X github.com/TykTechnologies/tyk-analytics/internal/build.Commit={{.FullCommit}}
      - -X github.com/TykTechnologies/tyk-analytics/internal/build.BuildDate={{.Date}}
      - -X github.com/TykTechnologies/tyk-analytics/internal/build.BuiltBy=goreleaser
    goos:
      - linux
    goarch:
      - amd64
    binary: tyk-analytics
  - id: std-amd64
    env:
      - NOP=nop # avoids a complex conditional in the templates
      - CC=gcc
    ldflags:
      - -X github.com/TykTechnologies/tyk-analytics/internal/build.Version={{.Version}}
      - -X github.com/TykTechnologies/tyk-analytics/internal/build.Commit={{.FullCommit}}
      - -X github.com/TykTechnologies/tyk-analytics/internal/build.BuildDate={{.Date}}
      - -X github.com/TykTechnologies/tyk-analytics/internal/build.BuiltBy=goreleaser
    goos:
      - linux
    goarch:
      - amd64
    binary: tyk-analytics
nfpms:
  - id: fips
    vendor: "Tyk Technologies Ltd"
    homepage: "https://tyk.io"
    maintainer: "Tyk <info@tyk.io>"
    description: Dashboard for the Tyk API Gateway. Built with FIPS 140-3 compliant cryptography.
    package_name: tyk-dashboard-fips
    file_name_template: "{{ .ConventionalFileName }}"
    ids:
      - fips-amd64
    formats:
      - deb
    contents:
      - src: "README.md"
        dst: "/opt/share/docs/tyk-dashboard/README.md"
      - src: "ci/install/*"
        dst: "/opt/tyk-dashboard/install"
      - src: ci/install/inits/systemd/system/tyk-dashboard.service
        dst: /lib/systemd/system/tyk-dashboard.service
      - src: ci/install/inits/sysv/init.d/tyk-dashboard
        dst: /etc/init.d/tyk-dashboard
      - src: /opt/tyk-dashboard
        dst: /opt/tyk-analytics
        type: "symlink"
      - src: "EULA.md"
        dst: "/opt/share/docs/tyk-dashboard/EULA.md"
      - src: "portal/*"
        dst: "/opt/tyk-dashboard/portal"
      - src: "utils/scripts/*"
        dst: "/opt/tyk-dashboard/utils/scripts"
      - src: "schemas/*"
        dst: "/opt/tyk-dashboard/schemas"
      - src: "webclient/lang/*"
        dst: "/opt/tyk-dashboard/lang"
      - src: tyk_config_sample.config
        dst: /opt/tyk-dashboard/tyk_analytics.conf
        type: "config|noreplace"
    scripts:
      preinstall: "ci/install/before_install.sh"
      postinstall: "ci/install/post_install.sh"
      postremove: "ci/install/post_remove.sh"
    bindir: "/opt/tyk-dashboard"
    deb:
      signature:
        key_file: tyk.io.signing.key
        type: origin
  - id: std
    vendor: "Tyk Technologies Ltd"
    homepage: "https://tyk.io"
    maintainer: "Tyk <info@tyk.io>"
    description: Dashboard for the Tyk API Gateway
    package_name: tyk-dashboard
    file_name_template: "{{ .ConventionalFileName }}"
    ids:
      - std-amd64
    formats:
      - deb
    contents:
      - src: "README.md"
        dst: "/opt/share/docs/tyk-dashboard/README.md"
      - src: "ci/install/*"
        dst: "/opt/tyk-dashboard/install"
      - src: ci/install/inits/systemd/system/tyk-dashboard.service
        dst: /lib/systemd/system/tyk-dashboard.service
      - src: ci/install/inits/sysv/init.d/tyk-dashboard
        dst: /etc/init.d/tyk-dashboard
      - src: /opt/tyk-dashboard
        dst: /opt/tyk-analytics
        type: "symlink"
      - src: "EULA.md"
        dst: "/opt/share/docs/tyk-dashboard/EULA.md"
      - src: "portal/*"
        dst: "/opt/tyk-dashboard/portal"
      - src: "utils/scripts/*"
        dst: "/opt/tyk-dashboard/utils/scripts"
      - src: "schemas/*"
        dst: "/opt/tyk-dashboard/schemas"
      - src: "webclient/lang/*"
        dst: "/opt/tyk-dashboard/lang"
      - src: tyk_config_sample.config
        dst: /opt/tyk-dashboard/tyk_analytics.conf
        type: "config|noreplace"
    scripts:
      preinstall: "ci/install/before_install.sh"
      postinstall: "ci/install/post_install.sh"
      postremove: "ci/install/post_remove.sh"
    bindir: "/opt/tyk-dashboard"
    deb:
      signature:
        key_file: tyk.io.signing.key
        type: origin
# This disables archives
archives:
  - formats: ['binary']
    allow_different_binary_count: true
checksum:
  disable: true
release:
  disable: true
  github:
    owner: TykTechnologies
    name: tyk-analytics
  prerelease: auto
  draft: true
  name_template: "{{.ProjectName}}-v{{.Version}}"
