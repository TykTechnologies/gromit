name: Test²
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
{{- if eq .Name "tyk-analytics" }}
    paths:
      - 'tests/ui/**'
      - 'tests/api/**'
{{- end }}
  push:
{{- if eq .Name "tyk-pro" }}
    tags:
      - 'v*'
{{- end }}
    branches:
      - master
      - release-*
{{- if eq .Name "tyk-analytics" }}
    paths:
      - 'tests/ui/**'
      - 'tests/api/**'
{{- end }}

env:
  VARIATION: prod-variation
  BASE_REF: {{`${{startsWith(github.event_name, 'pull_request') && github.base_ref || github.ref_name}}`}}

jobs:
{{- $DOT := . }}
{{- range $test := .Branchvals.Tests }}
  {{- template "auto-test" (dict "dot" $DOT "test" $test "flow" "test-square") }}
{{- end }}

{{ if eq .Name "tyk-pro" }}
  release:
    if: {{`${{ startsWith(github.ref, 'refs/tags') }}`}}
    # Backticks escape GitHub Actions syntax from Go template parsing
    runs-on: {{`${{ vars.DEFAULT_RUNNER }}`}}
    needs:
    {{- range $test := .Branchvals.Tests }}
      - {{ $test }}-tests
    {{- end }}
    permissions:
      contents: write  
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          app-id: {{`${{ secrets.PROBE_APP_ID }}`}}
          private-key: {{`${{ secrets.PROBE_APP_PRIVATE_KEY }}`}}
          owner: TykTechnologies

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          token: {{`${{ steps.app-token.outputs.token }}`}}
          name: {{`${{ github.ref_name }}`}}
          tag_name: {{`${{ github.ref_name }}`}}
          body_path: release.md
{{- end }} {{/* tyk-pro */}}
