{{- $pc := .Branchvals.PluginCompiler -}}
{{- $ng := $pc.NextGen -}}
{{- $tagSuffix := $ng.TagSuffixValue -}}
---
name: Plugin-compiler NG build

on:
  pull_request:
{{- if $pc.PullRequestTypesInline }}
    types: [{{ $pc.PullRequestTypes | join ", " }}]
{{- else }}
    types:
{{- range $type := $pc.PullRequestTypes }}
      - {{ $type }}
{{- end }}
{{- end }}
  push:
    branches:
      - master
      - release-**
    tags:
      - "v*"

env:
  GOLANG_CROSS: {{ $pc.GetGoImage .Branchvals.Buildenv }}
  NG_BASE_SOURCE: {{ $ng.BaseSourceImageRefValue }}
  NG_GLIBC_TARGET: "{{ $ng.GlibcTargetValue }}"
  NG_CROSS: "{{ $ng.CrossValue }}"
  NG_SLIM: "{{ $ng.SlimValue }}"
  NG_WITH_CXX: "{{ $ng.WithCxxValue }}"
  NG_WITH_GIT: "{{ $ng.WithGitValue }}"

concurrency:
  group: ${{`{{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'tags' || github.ref }}`}}
  cancel-in-progress: ${{`{{ github.event_name == 'pull_request' }}`}}

jobs:
  dep-guard:
{{- if $pc.DepGuardIf }}
    if: {{ $pc.DepGuardIf }}
{{- end }}
    uses: TykTechnologies/github-actions/.github/workflows/dependency-guard.yml@{{ $pc.DepGuardRef }}  # main
    permissions:
      contents: read

  docker-build:
    needs: [dep-guard]
    # The DHI customization that provisions the compiler toolchain is a private
    # Docker Hub repository, and GitHub withholds secrets from pull requests
    # raised from a fork. Such a run cannot pull the base at all, so skip it
    # instead of failing it with an opaque 401. There is deliberately no public
    # fallback base -- see ci/images/plugin-compiler-ng/Dockerfile.base.
    if: |
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
{{- if $pc.DockerBuildIfMultiline }}
{{ $pc.DockerBuildIf | indent 6 }}
{{- else }}
      ({{ $pc.DockerBuildIf | trimPrefix "${{" | trimSuffix "}}" | trim }})
{{- end }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reclaim runner space
        run: sudo rm -rf /usr/local/bin/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: {{ $pc.CheckoutDepth }}
{{ if $ng.ExtraImagePlatforms }}
      # The runners are amd64. Every other image platform is built and gated
      # under emulation, so binfmt has to be registered before buildx starts.
      # Rendered only while {{ $ng.ImagePlatformsValue }} asks for a non-native
      # platform -- an amd64-only image installs nothing.
      - name: Set up QEMU
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
{{ end }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with:
          driver: ${{`{{ github.event_name == 'pull_request' && 'docker' || 'docker-container' }}`}}

      - name: Configure AWS credentials
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355  # v2
        with:
          role-to-assume: arn:aws:iam::754489498669:role/ecr_rw_tyk
          role-session-name: ci-plugin-compiler-ng-push
          aws-region: eu-central-1

      - name: Login to AWS ECR
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7  # v1

      # Runs on pull requests too, unlike the ECR steps above: the toolchain base
      # lives in a private Docker Hub repository and every event needs to pull it.
      # Fork pull requests never reach this step -- the job is skipped for them.
      - name: Login to Docker Hub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc  # v2
        with:
          username: ${{`{{ secrets.DOCKER_USERNAME }}`}}
          password: ${{`{{ secrets.DOCKER_PASSWORD }}`}}

{{- if $ng.CustomizationID }}
      # Docker does not rebuild a customization when packages it ADDS are
      # patched -- only a base-image patch or an OCI artifact change triggers
      # one, and this base is a minimal BusyBox runtime that reports zero
      # vulnerabilities, so that trigger effectively never fires. Left alone the
      # toolchain drifts: we observed 12 days on a published expat fix, and a
      # manual rebuild then pulled expat and linux-libc-dev forward at once.
      # Reported as docker-hardened-images/advisories#2017.
      #
      # There is no supported way to request a rebuild. `customization build`
      # only offers get/list/logs, and `edit` is a no-op unless the manifest
      # actually differs -- while still reporting success. So stamp the run id
      # into an annotation purely to make the manifest unequal. The annotation
      # carries no meaning; delete this step once Docker ships a real trigger.
      #
      # Release events only: a pull request must not be able to rewrite the
      # shared hardened base.
      # Never fails the release. A refresh that does not happen means the base is
      # as fresh as it was yesterday, which is worse than current but far better
      # than blocking a release on Docker-side behaviour we do not control. The
      # step still reports loudly, and continue-on-error marks it red in the UI so
      # a persistently stale base is visible rather than silent.
      - name: Refresh Docker Hardened Images customization
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        continue-on-error: true
        env:
          DHI_CUSTOMIZATION: {{ $ng.CustomizationID }}
          DHI_ORG: {{ $ng.CustomizationOrgValue }}
        run: |
          set -euo pipefail
          # `docker dhi` ships with Docker Desktop and is absent from hosted
          # runners. Without this guard the first call falls through to plain
          # `docker`, which reports `unknown flag: --org` and exit 125 -- an error
          # that says nothing about the actual problem.
          if [ -z "${DHI_ORG:-}" ]; then
            echo "::warning title=DHI org not resolved::No Docker Hub organization could be derived for the customization, so it cannot be refreshed."
            printf '### DHI customization refresh\n\nSkipped: no organization resolved.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! docker dhi --help >/dev/null 2>&1; then
            echo "::warning title=DHI CLI unavailable::docker dhi is not installed on this runner, so the customization cannot be refreshed. The compiler will build on the existing base, which may be missing recent package fixes."
            printf '### DHI customization refresh\n\nSkipped: docker dhi is not available on this runner.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          before="$(docker dhi customization build list "$DHI_CUSTOMIZATION" \
            --org "$DHI_ORG" | awk 'NR==2 {print $1}')"
          echo "latest build before refresh: ${before:-none}"

          manifest="$RUNNER_TEMP/dhi-customization.yaml"
          docker dhi customization get "$DHI_CUSTOMIZATION" --org "$DHI_ORG" >"$manifest"

          # Replace any previous stamp so the file does not accumulate them.
          python3 - "$manifest" "$GITHUB_RUN_ID" <<'PY'
          import pathlib, re, sys

          path, run_id = pathlib.Path(sys.argv[1]), sys.argv[2]
          text = path.read_text()
          if not text.endswith("\n"):
              text += "\n"

          # Drop a previous stamp so the manifest does not accumulate them.
          text = re.sub(r'^ *io\.tyk\.rebuild-trigger:.*\n', '', text, flags=re.M)

          # Only a TOP-LEVEL `annotations:` may be stamped. Matching any occurrence
          # would hit a nested or similarly-named key (`image-annotations:`) and
          # dedent the new entry out of its mapping, corrupting the manifest that is
          # about to be sent to Docker.
          stamp = f'annotations:\n  io.tyk.rebuild-trigger: "{run_id}"\n'
          pattern = re.compile(r'^annotations:[ \t]*\n', re.M)
          matches = pattern.findall(text)
          if len(matches) > 1:
              raise SystemExit("refusing to stamp: multiple top-level annotations blocks")
          if matches:
              text = pattern.sub(stamp, text, count=1)
          else:
              text += stamp
          path.write_text(text)
          PY

          docker dhi customization edit "$manifest" --org "$DHI_ORG"

          # `edit` returns success even when it queues nothing, so poll for a
          # genuinely new build rather than trusting the exit code.
          for _ in $(seq 1 60); do
            latest="$(docker dhi customization build list "$DHI_CUSTOMIZATION" \
              --org "$DHI_ORG" | awk 'NR==2 {print $1}')"
            if [ -n "$latest" ] && [ "$latest" != "$before" ]; then
              echo "new build queued: $latest"
              break
            fi
            sleep 10
          done
          if [ -z "${latest:-}" ] || [ "$latest" = "$before" ]; then
            echo "::warning title=DHI customization not refreshed::No rebuild was queued; the compiler will build on the existing base, which may be missing recent package fixes."
            {
              printf '### DHI customization refresh\n\n'
              printf 'No rebuild was queued. Building on the existing base.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Wait for every platform build to settle, then fail on any failure.
          for _ in $(seq 1 120); do
            pending="$(docker dhi customization build list "$DHI_CUSTOMIZATION" \
              --org "$DHI_ORG" | awk 'NR>1 && $3 == "IN_PROGRESS"' | wc -l)"
            [ "$pending" -eq 0 ] && break
            sleep 15
          done
          docker dhi customization build list "$DHI_CUSTOMIZATION" --org "$DHI_ORG" | head -5
          # Columns: 1=ID 2=PLATFORM 3=STATUS 4=RESULT 5=STARTED. Check every row of
          # the batch we just queued -- they share a STARTED timestamp, and there is
          # one per platform -- rather than a fixed number of rows.
          if docker dhi customization build list "$DHI_CUSTOMIZATION" --org "$DHI_ORG" \
            | awk 'NR==2 {started=$5} NR>1 && $5 == started && $4 == "FAILURE"' | grep -q .; then
            echo "::warning title=DHI customization rebuild failed::The rebuild was queued but did not succeed; the compiler will build on the previous base."
            printf '### DHI customization refresh\n\nRebuild queued but failed.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '### DHI customization refresh\n\nRebuilt: %s\n' "$latest" >> "$GITHUB_STEP_SUMMARY"
{{- end }}

      - name: Resolve source base digest
        id: source-base
        run: |
          # Always the DHI customization. Pull requests build the same base the release
          # builds, so the compile/load gate validates the artifact that actually ships.
          source="$NG_BASE_SOURCE"
          inspect="$(docker buildx imagetools inspect "$source" --format '{{`{{json .}}`}}')"
          digest="$(jq -er '.manifest.digest' <<<"$inspect")"
          test -n "$digest"
          case "$digest" in sha256:*) ;; *) echo "unexpected source digest: $digest" >&2; exit 1 ;; esac
          if jq -e '(.manifest.manifests? | type) == "array"' <<<"$inspect" >/dev/null; then
            platform_digest="$(jq -er '
              [.manifest.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == "amd64"
              )] |
              if length == 1 then .[0].digest
              else error("expected exactly one linux/amd64 source manifest")
              end
            ' <<<"$inspect")"
          else
            platform_digest="$digest"
          fi
          case "$platform_digest" in sha256:*) ;; *) echo "unexpected source platform digest: $platform_digest" >&2; exit 1 ;; esac
{{- if $ng.ExtraImagePlatforms }}
          # BASE_IMAGE is passed as the index digest, so buildx picks the right
          # manifest per platform on its own. Check up front that every platform
          # we are about to build is actually in there: a missing one otherwise
          # surfaces much later as a bare "no match for platform" from a build
          # step that has no idea which of its inputs was at fault.
          for want in {{ $ng.ImagePlatformsValue | splitList "," | join " " }}; do
            jq -e --arg want "$want" '
              [.manifest.manifests[]? | select("\(.platform.os)/\(.platform.architecture)" == $want)]
              | length == 1
            ' <<<"$inspect" >/dev/null || {
              echo "::error title=Base image is missing a platform::${source} does not publish ${want}; the DHI customization has to be built for it first" >&2
              exit 1
            }
          done
{{- end }}
          if [[ "$source" == *@sha256:* ]]; then
            test "${source##*@}" = "$digest"
            ref="$source"
          else
            ref="${source}@${digest}"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "platform_digest=$platform_digest" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Resolve Go toolchain digest
        id: source-go
        run: |
          go_source="tykio/golang-cross:${GOLANG_CROSS}"
          inspect="$(docker buildx imagetools inspect "$go_source" --format '{{`{{json .}}`}}')"
          digest="$(jq -er '.manifest.digest' <<<"$inspect")"
          test -n "$digest"
          case "$digest" in sha256:*) ;; *) echo "unexpected Go toolchain digest: $digest" >&2; exit 1 ;; esac
          # amd64 on purpose, and not a copy of the base check above: golang-cross
          # is published for amd64 only. Other platforms take the Go distribution
          # from go.dev instead -- see the sha256 resolution further down.
          if jq -e '(.manifest.manifests? | type) == "array"' <<<"$inspect" >/dev/null; then
            platform_digest="$(jq -er '
              [.manifest.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == "amd64"
              )] |
              if length == 1 then .[0].digest
              else error("expected exactly one linux/amd64 Go toolchain manifest")
              end
            ' <<<"$inspect")"
          else
            platform_digest="$digest"
          fi
          case "$platform_digest" in sha256:*) ;; *) echo "unexpected Go toolchain platform digest: $platform_digest" >&2; exit 1 ;; esac
          ref="${go_source}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "platform_digest=$platform_digest" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

{{- if $ng.ImageNeedsGoTarball }}

          # golang-cross is the authority for WHICH Go version the gateway uses,
          # because the gateway release runs this same image. Read the version
          # out of it so platforms that cannot COPY from it can still be pinned
          # to exactly that version.
          #
          # This costs a full pull of golang-cross into the daemon, which is why
          # it is not done unconditionally: an amd64 image COPYs its toolchain
          # from that image anyway and reads the version out of it for free.
          go_version="$(docker run --rm --platform linux/amd64 "$ref" go version | awk '{print $3}')"
          case "$go_version" in
            go1.*) ;;
            *) echo "unexpected Go version from ${ref}: $go_version" >&2; exit 1 ;;
          esac
          echo "version=$go_version" >> "$GITHUB_OUTPUT"

          # golang-cross is published for amd64 only, so every other platform
          # takes the stock go.dev tarball at the version resolved above. Pin the
          # checksum here, before anything is downloaded, so the image build
          # verifies against a value settled outside it.
          #
          # Deliberately fatal: this only renders when a platform that needs the
          # tarball is being built, and guessing a checksum is not an option.
          sha_arm64="$(curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            'https://go.dev/dl/?mode=json&include=all' | jq -er --arg v "$go_version" '
              [.[] | select(.version == $v) | .files[]
                 | select(.os == "linux" and .arch == "arm64" and .kind == "archive")]
              | if length == 1 then .[0].sha256
                else error("no unique linux-arm64 archive for \($v)")
                end')"
          case "$sha_arm64" in
            ????????????????????????????????????????????????????????????????) ;;
            *) echo "unexpected sha256 for ${go_version} linux-arm64: $sha_arm64" >&2; exit 1 ;;
          esac
          echo "sha256_arm64=$sha_arm64" >> "$GITHUB_OUTPUT"
{{- end }}

      - name: Build workflow-local NG base
        id: build-ng-base
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9  # v4
        with:
          context: ci/images/plugin-compiler-ng
          file: ci/images/plugin-compiler-ng/Dockerfile.base
{{- if $ng.ExtraImagePlatforms }}
          # Pull requests use the `docker` driver, which builds one platform
          # only, and they never push -- so they stay on the gate platform.
          platforms: ${{`{{ github.event_name == 'pull_request' && '`}}{{ $ng.GatePlatformValue }}{{`' || '`}}{{ $ng.ImagePlatformsValue }}{{`' }}`}}
{{- else }}
          platforms: {{ $ng.ImagePlatformsValue }}
{{- end }}
          push: ${{`{{ github.event_name != 'pull_request' }}`}}
          load: ${{`{{ github.event_name == 'pull_request' }}`}}
          sbom: ${{`{{ github.event_name != 'pull_request' }}`}}
          provenance: ${{`{{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}`}}
          tags: ${{`{{ github.event_name == 'pull_request' && format('tyk-plugin-compiler-ng-base:{0}', github.sha) || format('{0}/`}}{{ $ng.WorkflowBaseImageNameValue }}{{`:ng-base-{1}-{2}', steps.login-ecr.outputs.registry, github.run_id, github.run_attempt) }}`}}
          build-args: |
            BASE_IMAGE=${{`{{ steps.source-base.outputs.ref }}`}}
            GLIBC_TARGET=${{`{{ env.NG_GLIBC_TARGET }}`}}
            CROSS=${{`{{ env.NG_CROSS }}`}}
            SLIM=${{`{{ env.NG_SLIM }}`}}
            WITH_CXX=${{`{{ env.NG_WITH_CXX }}`}}
            WITH_GIT=${{`{{ env.NG_WITH_GIT }}`}}
            DHI_DIGEST=${{`{{ steps.source-base.outputs.digest }}`}}
            GO_TOOLCHAIN_IMAGE_REF=${{`{{ steps.source-go.outputs.ref }}`}}

      - name: Select workflow-local NG base
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="tyk-plugin-compiler-ng-base:$GITHUB_SHA"
          else
            base="${{`{{ steps.login-ecr.outputs.registry }}`}}/{{ $ng.WorkflowBaseImageNameValue }}@${{`{{ steps.build-ng-base.outputs.digest }}`}}"
          fi
          echo "NG_BASE_IMAGE=$base" >> "$GITHUB_ENV"

{{ range $i, $variant := $pc.NextGenVariants }}      - name: Set Docker metadata{{ $variant.StepSuffix }}
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        id: {{ $variant.MetadataID }}-ng
        uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175  # v4
        with:
          images: |
            tykio/{{ $variant.ImageName }},enable=${{`{{ startsWith(github.ref, 'refs/tags/') }}`}}
            ${{`{{ steps.login-ecr.outputs.registry }}`}}/{{ $variant.ImageName }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title={{ $variant.NextGenTitle $tagSuffix }}
            org.opencontainers.image.description={{ $variant.Description }} (next generation)
          tags: |
            type=semver,pattern=v{{`{{version}}`}},suffix={{ $tagSuffix }}
            type=semver,pattern=v{{`{{major}}`}}.{{`{{minor}}`}},suffix={{ $tagSuffix }}
            type=semver,pattern={{`{{raw}}`}},suffix={{ $tagSuffix }}
            type=sha,format=long,suffix={{ $tagSuffix }}

      - name: Build local NG gate image{{ $variant.StepSuffix }}
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9  # v4
        with:
          context: .
          file: ci/images/plugin-compiler-ng/Dockerfile.release
          # Single platform deliberately: `load: true` accepts exactly one.
          platforms: {{ $ng.GatePlatformValue }}
          push: false
          load: true
          tags: tyk-plugin-compiler-ng-gate:{{ default "std" $variant.Name }}
          build-args: |
            BASE_IMAGE=${{`{{ env.NG_BASE_IMAGE }}`}}
            GOLANG_IMAGE=${{`{{ steps.source-go.outputs.ref }}`}}
{{- if $ng.ImageNeedsGoTarball }}
            GO_VERSION=${{`{{ steps.source-go.outputs.version }}`}}
            GO_TARBALL_SHA256_ARM64=${{`{{ steps.source-go.outputs.sha256_arm64 }}`}}
{{- end }}
            GITHUB_SHA=${{`{{ github.sha }}`}}
            GITHUB_TAG=${{`{{ github.ref_name }}`}}
            WITH_GATEWAY_SELFTEST=1{{ $ng.VariantBuildArgsBlock $variant }}

      - name: Gate NG plugin load{{ $variant.StepSuffix }}
        run: ci/images/plugin-compiler-ng/scripts/loadtest-gate.sh tyk-plugin-compiler-ng-gate:{{ default "std" $variant.Name }} {{ $variant.NextGenEdition }}

{{ if eq ($ng.CrossValue) "1" }}      - name: Validate NG cross-build arm64{{ $variant.StepSuffix }}
        run: VALIDATE_ONLY=1 ci/images/plugin-compiler-ng/scripts/loadtest-gate.sh tyk-plugin-compiler-ng-gate:{{ default "std" $variant.Name }} {{ $variant.NextGenEdition }} arm64

{{ if eq ($variant.NextGenEdition) "ce" }}      - name: Validate NG cross-build s390x{{ $variant.StepSuffix }}
        run: VALIDATE_ONLY=1 ci/images/plugin-compiler-ng/scripts/loadtest-gate.sh tyk-plugin-compiler-ng-gate:{{ default "std" $variant.Name }} {{ $variant.NextGenEdition }} s390x

{{ end }}{{ end }}
{{- if $ng.GatesExtraPlatforms $variant }}{{ range $platform := $ng.ExtraImagePlatforms }}{{ $pslug := $platform | replace "/" "-" }}
      # Tier B gate. The push below emits a single OCI index covering every
      # platform, so a broken {{ $platform }} image blocks the whole push --
      # including platforms that are perfectly fine. Build and exercise this one
      # on its own first, where a failure is attributable and nothing has been
      # published yet.
      #
      # WITH_GATEWAY_SELFTEST=0 on purpose: VALIDATE_ONLY skips the load/HTTP
      # gate, so the gateway binary would be built under emulation and never run.
      - name: Build {{ $platform }} NG gate image{{ $variant.StepSuffix }}
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9  # v4
        with:
          context: .
          file: ci/images/plugin-compiler-ng/Dockerfile.release
          platforms: {{ $platform }}
          push: false
          load: true
          tags: tyk-plugin-compiler-ng-gate-{{ $pslug }}:{{ default "std" $variant.Name }}
          build-args: |
            BASE_IMAGE=${{`{{ env.NG_BASE_IMAGE }}`}}
            GOLANG_IMAGE=${{`{{ steps.source-go.outputs.ref }}`}}
{{- if $ng.ImageNeedsGoTarball }}
            GO_VERSION=${{`{{ steps.source-go.outputs.version }}`}}
            GO_TARBALL_SHA256_ARM64=${{`{{ steps.source-go.outputs.sha256_arm64 }}`}}
{{- end }}
            GITHUB_SHA=${{`{{ github.sha }}`}}
            GITHUB_TAG=${{`{{ github.ref_name }}`}}
            WITH_GATEWAY_SELFTEST=0{{ $ng.VariantBuildArgsBlock $variant }}

      # Proves the {{ $platform }} toolchain executes and emits a loadable
      # object for its own architecture -- strictly more than the cross-build
      # checks above, which only ever exercise the amd64 image.
      #
      # It stops short of plugin.Open in a {{ $platform }} gateway: that needs a
      # runner of this architecture. See the PR for the gap and the follow-up.
      - name: Validate {{ $platform }} NG toolchain{{ $variant.StepSuffix }}
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        run: VALIDATE_ONLY=1 COMPILER_PLATFORM={{ $platform }} ci/images/plugin-compiler-ng/scripts/loadtest-gate.sh tyk-plugin-compiler-ng-gate-{{ $pslug }}:{{ default "std" $variant.Name }} {{ $variant.NextGenEdition }}

{{ end }}{{ end }}
      - name: Build and push NG image{{ $variant.StepSuffix }}
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        id: {{ $variant.PublishID }}
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9  # v4
        with:
          context: .
          file: ci/images/plugin-compiler-ng/Dockerfile.release
          platforms: {{ $ng.ImagePlatformsValue }}
          push: true
          sbom: true
          provenance: mode=max
          labels: ${{`{{ steps.`}}{{ $variant.MetadataID }}{{`-ng.outputs.labels }}`}}
          tags: ${{`{{ steps.`}}{{ $variant.MetadataID }}{{`-ng.outputs.tags }}`}}
          build-args: |
            BASE_IMAGE=${{`{{ env.NG_BASE_IMAGE }}`}}
            GOLANG_IMAGE=${{`{{ steps.source-go.outputs.ref }}`}}
{{- if $ng.ImageNeedsGoTarball }}
            GO_VERSION=${{`{{ steps.source-go.outputs.version }}`}}
            GO_TARBALL_SHA256_ARM64=${{`{{ steps.source-go.outputs.sha256_arm64 }}`}}
{{- end }}
            GITHUB_SHA=${{`{{ github.sha }}`}}
            GITHUB_TAG=${{`{{ github.ref_name }}`}}
            WITH_GATEWAY_SELFTEST=0{{ $ng.VariantBuildArgsBlock $variant }}

      - name: Verify pushed NG digest and attestations{{ $variant.StepSuffix }}
        if: ${{`{{ github.event_name != 'pull_request' }}`}}
        env:
          PUBLISHED_DIGEST: ${{`{{ steps.`}}{{ $variant.PublishID }}{{`.outputs.digest }}`}}
          PUBLISHED_TAGS: ${{`{{ steps.`}}{{ $variant.MetadataID }}{{`-ng.outputs.tags }}`}}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/plugin-compiler-ng-evidence/{{ default "std" $variant.Name }}"
          mkdir -p "$evidence_dir"
          {
            printf 'variant=%s\n' '{{ default "std" $variant.Name }}'
            printf 'published_digest=%s\n' "$PUBLISHED_DIGEST"
            printf 'source_base=%s\n' '${{`{{ steps.source-base.outputs.ref }}`}}'
            printf 'source_base_linux_amd64_digest=%s\n' '${{`{{ steps.source-base.outputs.platform_digest }}`}}'
            printf 'go_toolchain=%s\n' '${{`{{ steps.source-go.outputs.ref }}`}}'
            printf 'go_toolchain_linux_amd64_digest=%s\n' '${{`{{ steps.source-go.outputs.platform_digest }}`}}'
            printf 'workflow_base=%s\n' "$NG_BASE_IMAGE"
            printf 'published_tags<<EOF\n%s\nEOF\n' "$PUBLISHED_TAGS"
          } > "$evidence_dir/metadata.txt"

          case "$PUBLISHED_DIGEST" in sha256:*) ;; *) echo "unexpected published digest: $PUBLISHED_DIGEST" >&2; exit 1 ;; esac

          repositories="$evidence_dir/repositories.txt"
          printf '%s\n' "$PUBLISHED_TAGS" |
            tr ',' '\n' |
            sed '/^[[:space:]]*$/d; s/[[:space:]]*$//' |
            while IFS= read -r tag; do printf '%s\n' "${tag%:*}"; done |
            sort -u > "$repositories"

          expected_repositories=1
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_repositories=2
          fi
          actual_repositories="$(wc -l < "$repositories" | tr -d '[:space:]')"
          test "$actual_repositories" = "$expected_repositories"

          while IFS= read -r repository; do
            exact_ref="${repository}@${PUBLISHED_DIGEST}"
            safe_repository="$(printf '%s' "$repository" | tr '/:.' '_')"
            inspect_file="$evidence_dir/${safe_repository}.inspect.txt"
            sbom_file="$evidence_dir/${safe_repository}.sbom.json"
            provenance_file="$evidence_dir/${safe_repository}.provenance.json"

            docker buildx imagetools inspect "$exact_ref" | tee "$inspect_file"
            resolved="$(awk '/^Digest:/ {print $2; exit}' "$inspect_file")"
            test "$resolved" = "$PUBLISHED_DIGEST"

            docker buildx imagetools inspect "$exact_ref" --format '{{`{{json .SBOM}}`}}' > "$sbom_file"
            jq -e '[.. | objects | select(has("SPDX"))] | length > 0' "$sbom_file" >/dev/null

            docker buildx imagetools inspect "$exact_ref" --format '{{`{{json .Provenance}}`}}' > "$provenance_file"
            jq -e '[.. | objects | select(has("SLSA"))] | length > 0' "$provenance_file" >/dev/null

            # The index must offer exactly the platforms that were asked for --
            # no more, no fewer. buildx reports success for a partially built
            # index, and an attestation manifest carries `unknown/unknown`, so
            # counting manifests or trusting the exit code would both pass while
            # a platform silently went missing. `.manifests` being absent
            # entirely means the push produced a bare manifest instead of an
            # index, which is the same failure in its most extreme form, so name
            # it rather than letting jq fall over on a missing key.
            platforms_file="$evidence_dir/${safe_repository}.platforms.txt"
            docker buildx imagetools inspect "$exact_ref" --raw |
              jq -er 'if has("manifests") then
                        .manifests[]
                        | select(.platform.os != "unknown")   # attestations carry unknown/unknown
                        | "\(.platform.os)/\(.platform.architecture)"
                      else error("published ref is not an image index") end' |
              sort -u > "$platforms_file"
            printf '%s\n' {{ $ng.ImagePlatformsValue | splitList "," | sortAlpha | join " " }} > "$evidence_dir/platforms.expected.txt"
            if ! diff -u "$evidence_dir/platforms.expected.txt" "$platforms_file"; then
              echo "::error title=Published platforms do not match::${exact_ref} does not publish exactly {{ $ng.ImagePlatformsValue }}" >&2
              exit 1
            fi

            printf 'verified %s\n' "$exact_ref" | tee -a "$evidence_dir/verified-refs.txt" "$GITHUB_STEP_SUMMARY"
          done < "$repositories"

      - name: Retain pushed NG evidence{{ $variant.StepSuffix }}
        if: ${{`{{ always() && github.event_name != 'pull_request' && steps.`}}{{ $variant.PublishID }}{{`.outcome == 'success' }}`}}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plugin-compiler-ng-{{ default "std" $variant.Name }}-${{`{{ github.run_id }}`}}-${{`{{ github.run_attempt }}`}}
          path: ${{`{{ runner.temp }}`}}/plugin-compiler-ng-evidence/{{ default "std" $variant.Name }}
          if-no-files-found: error
          retention-days: 30{{ if lt (add1 $i) (len ($pc.NextGenVariants)) }}

{{ end }}{{ end }}
