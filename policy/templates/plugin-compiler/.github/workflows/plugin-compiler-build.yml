{{- $pc := .Branchvals.PluginCompiler -}}
---
name: Plugin-compiler build

on:
  pull_request:
{{- if $pc.PullRequestTypesInline }}
    types: [{{ $pc.PullRequestTypes | join ", " }}]
{{- else }}
    types:
{{- range $type := $pc.PullRequestTypes }}
      - {{ $type }}
{{- end }}
{{- end }}
  push:
    branches:
      - master
      - release-**
    tags:
      - "v*"

env:
  GOLANG_CROSS: {{ .Branchvals.Buildenv }}

concurrency:
  group: ${{`{{ github.workflow }}-${{ github.ref }}`}}
  cancel-in-progress: ${{`{{ github.event_name == 'pull_request' }}`}}

jobs:
  dep-guard:
{{- if $pc.DepGuardIf }}
    if: {{ $pc.DepGuardIf }}
{{- end }}
    uses: TykTechnologies/github-actions/.github/workflows/dependency-guard.yml@{{ $pc.DepGuardRef }}  # main
    permissions:
      contents: read
      pull-requests: read  # dep-guard reads the PR's current labels, so a re-run sees deps-reviewed

  docker-build:
    needs: [dep-guard]
{{- if $pc.DockerBuildIfMultiline }}
    if: |
{{ $pc.DockerBuildIf | indent 6 }}
{{- else }}
    if: {{ $pc.DockerBuildIf }}
{{- end }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: "Reclaim some runner space"
        run: sudo rm -rf /usr/local/bin/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: {{ $pc.CheckoutDepth }}

      - name: Configure AWS Credentials
        id: configure-aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::754489498669:role/ecr_rw_tyk
          role-session-name: ci-plugin-compiler-push
          aws-region: eu-central-1

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783  # v2.2.0

{{ range $i, $variant := $pc.Variants }}      - name: Set docker metadata{{ $variant.StepSuffix }}
        id: {{ $variant.MetadataID }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            tykio/{{ $variant.ImageName }},enable=${{`{{ startsWith(github.ref, 'refs/tags') }}`}}
            ${{`{{ steps.login-ecr.outputs.registry }}`}}/{{ $variant.ImageName }}
          labels: |
            org.opencontainers.image.title={{ $variant.Title }}
            org.opencontainers.image.description={{ $variant.Description }}
          tags: |
            type=ref,event=pr
            type=semver,pattern=v{{`{{version}}`}}
            type=semver,pattern=v{{`{{major}}`}}.{{`{{minor}}`}}
            type=semver,pattern={{`{{raw}}`}}
            type=sha,format=long

{{ if eq $variant.Name "std" }}      - name: Login to Dockerhub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{`{{ secrets.DOCKER_USERNAME }}`}}
          password: ${{`{{ secrets.DOCKER_PASSWORD }}`}}

{{ end }}      - name: Build and push to dockerhub/ECR{{ $variant.StepSuffix }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ci/images/plugin-compiler/Dockerfile
          platforms: linux/amd64
          push: true
          labels: ${{`{{ steps.`}}{{ $variant.MetadataID }}{{`.outputs.labels }}`}}
          tags: ${{`{{ steps.`}}{{ $variant.MetadataID }}{{`.outputs.tags }}`}}
          build-args: |
            BASE_IMAGE=tykio/golang-cross:${{`{{ env.GOLANG_CROSS }}`}}
            GITHUB_SHA=${{`{{ github.sha }}`}}
            GITHUB_TAG=${{`{{ github.ref_name }}`}}{{ $variant.BuildArgsBlock }}{{ if lt (add1 $i) (len $pc.Variants) }}

{{ end }}{{ end }}
