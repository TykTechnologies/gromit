{{- if and (has "docs-preview" .Branchvals.Features) (not (has .Name (list "tyk" "tyk-analytics" "tyk-pump" "tyk-sink" "portal"))) }}
{{- fail "docs-preview supports only tyk, tyk-analytics, tyk-pump, tyk-sink and portal" }}
{{- end }}
name: Docs preview

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  docs-preview:
    uses: TykTechnologies/github-actions/.github/workflows/docs-preview.yml@production
    with:
      {{- if eq .Name "tyk" }}
      component: gateway
      docs_paths: |
        apidef/oas/**
        config/**
        swagger.yml
      {{- else if eq .Name "tyk-analytics" }}
      component: dashboard
      docs_paths: |
        config/**
        swagger.yml
        swagger-admin.yml
        docs/opa/**
      {{- else if eq .Name "tyk-pump" }}
      component: pump
      docs_paths: |
        config.go
      {{- else if eq .Name "tyk-sink" }}
      component: mdcb
      docs_paths: |
        config/**
        swagger.yml
      {{- else if eq .Name "portal" }}
      component: portal
      docs_paths: |
        docs/api/**
      {{- end }}
      pm_team: pms
    secrets:
      PROBE_APP_ID: {{`${{ secrets.PROBE_APP_ID }}`}}
      PROBE_APP_PRIVATE_KEY: {{`${{ secrets.PROBE_APP_PRIVATE_KEY }}`}}
    permissions:
      contents: read
      pull-requests: write
