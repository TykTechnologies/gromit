name: Docker Hub secret sweep

# Daily secret scan of every image pushed to the tykio Docker Hub org's
# public repositories in the last day. Release pipelines scan their own
# images before pushing; this catches the rest, such as images pushed by
# hand or from a pipeline without the scan. Report only: nothing is
# blocked or deleted.
#
# This repository is public and so are its Actions logs, so the scan runs
# with report-details off. What it found goes only to Slack.

on:
  schedule:
    - cron: '30 5 * * *'  # 05:30 UTC daily
  workflow_dispatch:
    inputs:
      since:
        description: 'How far back to look (Go duration, e.g. 26h or 72h)'
        type: string
        required: false
        default: '26h'

concurrency:
  group: dockerhub-secret-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    # Only numbers leave this job. GitHub drops a job output that contains
    # the value of any secret, and "pushed by" holds the CI Docker Hub
    # account, so the image details travel as an artifact instead.
    outputs:
      indices: ${{ steps.list.outputs.indices }}
      count: ${{ steps.list.outputs.count }}
      total: ${{ steps.list.outputs.total }}
      failed: ${{ steps.list.outputs.failed }}
    steps:
      # An older action would ignore report-details and print what it
      # found in this public log, so stop before anything is scanned.
      - name: Check the scan action can withhold details
        run: |
          curl -fsSL https://raw.githubusercontent.com/TykTechnologies/github-actions/production/.github/actions/secret-scan/action.yml |
            grep -q '^  report-details:'

      - name: Checkout gromit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: List recent images
        id: list
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SINCE: ${{ inputs.since || '26h' }}
          MAX_IMAGES: "250"
        run: |
          go run . pkgs images recent --since "$SINCE" > recent.json
          total=$(jq '.images | length' recent.json)
          # A matrix takes at most 256 jobs. Scan the newest; the summary
          # reports how many were left out.
          jq --argjson n "$MAX_IMAGES" '.images | sort_by(.last_pushed) | reverse | .[:$n]' recent.json > images.json
          {
            echo "total=$total"
            echo "count=$(jq length images.json)"
            echo "failed=$(jq '.failed | length' recent.json)"
            echo "indices=$(jq -c '[range(0; length)]' images.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r '.failed[] | "::warning::could not list \(.)"' recent.json
          echo "$total image(s) pushed in the last $SINCE" >> "$GITHUB_STEP_SUMMARY"

      # Public Docker Hub data (references, tags, who pushed), not secrets.
      - name: Share the image list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-images
          path: images.json
          retention-days: 3
          overwrite: true

  scan:
    needs: list
    if: needs.list.outputs.count != '0'
    name: scan ${{ matrix.index }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: ${{ fromJSON(needs.list.outputs.indices) }}
    env:
      INDEX: ${{ matrix.index }}
    steps:
      - name: Get the image list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-images

      - name: Pick this job's image
        id: image
        run: echo "ref=$(jq -r --argjson i "$INDEX" '.[$i].ref' images.json)" >> "$GITHUB_OUTPUT"


      # Pulls count against the org's limit rather than the runner's
      # anonymous one.
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan for secrets
        id: scan
        uses: TykTechnologies/github-actions/.github/actions/secret-scan@production
        with:
          image: ${{ steps.image.outputs.ref }}
          enforce: "false"
          report-details: "false"

      - name: Build the Slack alert
        id: alert
        if: always() && (steps.scan.outputs.findings != '0' || steps.scan.outcome == 'failure')
        env:
          REPORT: ${{ steps.scan.outputs.report }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          OUTCOME: ${{ steps.scan.outcome }}
          CHANNEL: ${{ secrets.NONFUNC_SLACK_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Fall back rather than fail: a missing list or field must not
          # cost the alert.
          REF=$(jq -r --argjson i "$INDEX" '.[$i].ref // "unknown"' images.json 2>/dev/null) || REF="image $INDEX"
          TAGS=$(jq -r --argjson i "$INDEX" '(.[$i].tags // []) | join(", ")' images.json 2>/dev/null) || TAGS="unknown"
          PUSHED_BY=$(jq -r --argjson i "$INDEX" '(.[$i].pushed_by // []) | join(", ")' images.json 2>/dev/null) || PUSHED_BY="unknown"
          if [ "$OUTCOME" = "failure" ] || [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            head="*Docker Hub secret sweep: scan failed* for \`$REF\` (tags: $TAGS; pushed by: $PUSHED_BY). The image was not checked."
            lines=""
          else
            head="*Docker Hub secret sweep: $FINDINGS finding(s)* in \`$REF\` (tags: $TAGS; pushed by: $PUSHED_BY). Check each one; rotate any real credential first."
            lines=$(jq -rs '.[:20][] | "• \(.tool) \(.rule): `\(.file | gsub("`"; "'"'"'"))`\(if .platform != "" then " [\(.platform)]" else "" end)"' "$REPORT")
            total=$(wc -l < "$REPORT" | tr -d ' ')
            [ "$total" -gt 20 ] && lines="$lines"$'\n'"… and $((total - 20)) more"
          fi
          jq -n --arg channel "$CHANNEL" --arg text "$head"$'\n'"$lines"$'\n'"<$RUN_URL|Run>" \
            '{channel: $channel, text: $text}' > "$RUNNER_TEMP/slack.json"

      - name: Slack alert
        if: always() && steps.alert.outcome == 'success'
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload-file-path: ${{ runner.temp }}/slack.json

      # Counts only. An image with no result file was not checked, which
      # covers a job that died before this step.
      - name: Record the result
        if: always()
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          mkdir -p result
          jq -n --argjson i "$INDEX" --arg outcome "$OUTCOME" --arg findings "$FINDINGS" \
            '{index: $i, outcome: $outcome, findings: $findings}' > "result/$INDEX.json"

      - name: Share the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-result-${{ matrix.index }}
          path: result/
          retention-days: 3
          # A re-run of a failed job uploads under the same name.
          overwrite: true

  # Posts on every run, so a quiet day still shows the sweep ran. A day
  # with no summary means the sweep itself did not run.
  summary:
    needs: [list, scan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Get the image list
        if: needs.list.outputs.count != '0' && needs.list.outputs.count != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-images

      - name: Get the scan results
        if: needs.list.outputs.count != '0' && needs.list.outputs.count != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-result-*
          path: result
          merge-multiple: true

      # An image counts as scanned only if its job recorded a successful
      # scan, so a failed matrix can never read as "all clean".
      - name: Build the summary
        env:
          LIST: ${{ needs.list.result }}
          TOTAL: ${{ needs.list.outputs.total }}
          COUNT: ${{ needs.list.outputs.count }}
          FAILED: ${{ needs.list.outputs.failed }}
          SINCE: ${{ inputs.since || '26h' }}
          CHANNEL: ${{ secrets.NONFUNC_SLACK_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$LIST" != "success" ]; then
            text="*Docker Hub secret sweep failed*: could not list the images, so nothing was checked."
          elif [ "${COUNT:-0}" = "0" ]; then
            text="*Docker Hub secret sweep*: no images pushed in the last $SINCE."
          else
            [ -f images.json ] || echo '[]' > images.json
            mkdir -p result
            jq -s '.' result/*.json 2>/dev/null > results.json || echo '[]' > results.json
            text=$(jq -r --slurpfile r results.json --argjson count "$COUNT" --arg total "${TOTAL:-$COUNT}" --arg since "$SINCE" '
              ($r[0] | map({(.index | tostring): .}) | add // {}) as $res
              | [range(0; $count) as $i
                 | (.[$i] // {}) as $img
                 | ($res[$i | tostring] // {}) as $x
                 | {name: "`\($img.image // "image \($i)")` \(($img.tags // []) | join(", "))",
                    state: (if $x.outcome == "success" and $x.findings == "0" then "clean"
                            elif $x.outcome == "success" and ($x.findings // "") != "" then "findings"
                            else "unchecked" end),
                    findings: ($x.findings // "")}] as $rows
              | ($rows | map(select(.state == "clean")) | length) as $clean
              | ($rows | map(select(.state == "findings")) | length) as $hits
              | ($rows | map(select(.state == "unchecked")) | length) as $miss
              | ["*Docker Hub secret sweep*: \($total) image(s) pushed in the last \($since): \($clean) clean, \($hits) with findings, \($miss) not checked."]
                + ($rows | map(select(.state == "findings")) | .[:10] | map("• :warning: \(.findings) finding(s): \(.name)"))
                + ($rows | map(select(.state == "unchecked")) | .[:10] | map("• :x: not checked: \(.name)"))
                + (if $hits > 0 then ["The files and rules for each finding are posted separately."] else [] end)
                + (if $miss > 0 then ["Not checked means the scan did not run or failed; see the run."] else [] end)
              | join("\n")' images.json)
            if [ "${TOTAL:-0}" != "${COUNT:-0}" ]; then
              text="$text"$'\n'"*$((TOTAL - COUNT)) more not checked*: over the per-run limit."
            fi
          fi
          if [ "${FAILED:-0}" != "0" ] && [ -n "$FAILED" ]; then
            text="$text"$'\n'"*$FAILED repo(s) could not be listed*; see the run."
          fi
          jq -n --arg channel "$CHANNEL" --arg text "$text"$'\n'"<$RUN_URL|Run>" '{channel: $channel, text: $text}' > "$RUNNER_TEMP/slack.json"

      - name: Slack summary
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload-file-path: ${{ runner.temp }}/slack.json
