# goreleaser knows not to publish when the trigger is _not_ a tag

name: Release

on:
  pull_request:
  push:
    tags:
      - v*
    branches:
      - master
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository name to sync, e.g. "tyk" (equivalent to running `gromit policy sync tyk` locally). Use "all" to sync all repositories.'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - tyk
          - tyk-analytics
          - tyk-pump
          - tyk-identity-broker
          - tyk-sink
          - portal
          - tyk-pro
          - ara
      branch:
        description: 'Branch name to sync, e.g. "release-5.13.0" (equivalent to running `gromit policy sync <repo> --branch release-5.13.0` locally). Leave empty to sync all configured branches.'
        type: string
        required: false
        default: ''
      pr:
        description: 'Create Pull Request (PR) in the downstream repository'
        type: boolean
        required: false
        default: true
      title:
        description: 'Title of the PR (required if "Create Pull Request" is checked), e.g. "gromit: update golangci-lint version"'
        type: string
        required: false
        default: 'gromit: sync templates'
      jira:
        description: 'Jira issue key to use in the PR title, e.g. "TT-12345". Required when "Create Pull Request" is checked.'
        type: string
        required: false
        default: ''
      prefix:
        description: 'Branch prefix for template changes, e.g. "releng/" or "update/"'
        type: string
        required: false
        default: 'releng/'

jobs:
  dep-guard:
    if: github.event_name == 'pull_request'
    uses: TykTechnologies/github-actions/.github/workflows/dependency-guard.yml@production

  goreleaser:
    needs: [dep-guard]
    if: always() && (needs.dep-guard.result == 'success' || needs.dep-guard.result == 'skipped')
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    permissions:
      id-token: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 # zizmor: ignore[github-app] owner-wide token, scoping tracked separately
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - run: make test

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          version: "~> v2"
          args: release --clean ${{ !startsWith(github.ref, 'refs/tags/') && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: find linux binary for this runner
        id: binary
        run: |
          case "$(uname -m)" in
            x86_64) goarch=amd64 ;;
            aarch64|arm64) goarch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          path=$(jq -rc --arg a "$goarch" '.[] | select((.type=="Binary") and (.goos=="linux") and (.goarch==$a)) | .path' dist/artifacts.json)
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gromit-linux
          path: ${{ steps.binary.outputs.path }}
          retention-days: 1

  doctor:
    needs: goreleaser
    if: always() && needs.goreleaser.result == 'success'
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        repo:
          [
            tyk,
            tyk-analytics,
            tyk-pump,
            tyk-identity-broker,
            tyk-sink,
            portal,
            tyk-pro,
            ara,
          ]
        include:
          - owner: TykTechnologies

    steps:
      - name: Generate GitHub App token
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repo == 'all' || inputs.repo == matrix.repo }}
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 # zizmor: ignore[github-app] owner-wide token, scoping tracked separately
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      - name: checkout ${{matrix.repo}}/${{matrix.branch}}
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repo == 'all' || inputs.repo == matrix.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ matrix.owner }}/${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: ${{ matrix.repo }}
          fetch-depth: 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repo == 'all' || inputs.repo == matrix.repo }}
        id: download
        with:
          name: gromit-linux

      - name: prepare gromit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repo == 'all' || inputs.repo == matrix.repo }}
        id: gromit
        run: |
          gromit="${{ steps.download.outputs.download-path }}/gromit"
          chmod +x $gromit
          echo "bin=${gromit}" >> "$GITHUB_OUTPUT"

      - name: update ${{ matrix.repo }}
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.repo == 'all' || inputs.repo == matrix.repo)) || (github.event_name == 'push' && github.ref_name == 'master') || endsWith(github.head_ref, 'releng') }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # For push events, the Jira ID is taken from the title of the PR
          # that was merged in this push (found via the commit->pulls API),
          # falling back to the head commit message. Master is protected
          # (PRs only, admins included) and the Jira linter requires PR
          # titles to carry a valid issue key, so an ID is always present.
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_JIRA: ${{ inputs.jira }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          set -eo pipefail
          BRANCH_ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.branch }}" ]; then
            BRANCH_ARGS=(--branch "${{ inputs.branch }}")
          fi
          
          PREFIX_ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.prefix }}" ]; then
            PREFIX_ARGS=(--prefix "${{ inputs.prefix }}")
          fi
          
          find_jira_id() {
            local jira_id=""
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              jira_id="$INPUT_JIRA"
            elif [ "${{ github.event_name }}" = "push" ]; then
              # Title of the PR merged in this push, if any
              local pr_title
              pr_title=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].title // empty' 2>/dev/null || true)
              jira_id=$(printf '%s\n%s\n' "$pr_title" "$HEAD_COMMIT_MSG" | grep -oEi -m1 '[A-Z]{1,10}-[0-9]{1,10}' | head -n1 || true)
            fi
            echo "$jira_id" | tr '[:lower:]' '[:upper:]'
          }
          
          PR_ARGS=()
          if { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "master" ]; } || \
             { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.pr }}" = "true" ]; }; then
            JIRA_ID=$(find_jira_id)
            if [ -z "$JIRA_ID" ]; then
              echo "::error::No Jira issue key found. For manual runs, fill in the 'jira' input; for pushes, the merged PR title must contain one (e.g. TT-12345). Downstream PRs would fail the Jira linter without it." >&2
              exit 1
            fi
            echo "Using Jira ID: $JIRA_ID"
            PR_TITLE="${INPUT_TITLE:-gromit: sync templates}"
            PR_ARGS=(--pr --title "$PR_TITLE" --jira "$JIRA_ID")
          fi
          
          ${{ steps.gromit.outputs.bin }} policy sync ${{ matrix.repo }} "${BRANCH_ARGS[@]}" "${PREFIX_ARGS[@]}" "${PR_ARGS[@]}"
          
          echo "## :hospital: ℞ ${{ matrix.repo }}" >> $GITHUB_STEP_SUMMARY
          cd ${{ matrix.repo }} && for b in $(git for-each-ref --format '%(refname:short)' refs/heads); do
             echo -e "<details>\n <summary> ${{ matrix.repo }} $b </summary>\n"
             git log --oneline origin/$b..$b
             echo -e "</details>\n"
          done >> $GITHUB_STEP_SUMMARY
